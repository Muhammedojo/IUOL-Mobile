name: ioul
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.19.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_custom_theme: ^0.2.1
  cached_network_image: ^3.2.3
  chewie: ^1.8.5
  audio_video_progress_bar: ^2.0.0
  equatable: ^2.0.5
  just_audio_background: ^0.0.1-beta.10
  rxdart: ^0.27.7
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.2
  flutter_easyloading: ^3.0.5
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  path: ^1.8.3
  archive: ^3.3.9
  flutter_screenutil: ^5.9.3
  image_picker: ^1.0.7
  file_picker: ^8.3.1
  flutter_svg: ^1.0.3
  toggle_switch: ^2.1.0
  intl: ^0.19.0
  h3m_shimmer_card: ^0.0.2
  syncfusion_flutter_pdfviewer: ^27.2.5
  audioplayers: ^6.1.0
  go_router: ^8.0.5
  flutter_native_splash: ^2.2.19
  pinput: ^2.2.31
  cool_dropdown: ^2.1.0
  #mockito: ^5.4.3
  mocktail: ^1.0.1
  animated_custom_dropdown: ^1.5.0
  group_button: ^5.3.0
  intl_phone_field: ^3.2.0
  chips_choice: ^3.0.0
  video_player: ^2.9.2
  flutter_windowmanager: ^0.2.0
  flutter_dotenv: ^5.1.0
  responsive_framework: ^1.4.0
  url_launcher: ^6.1.14
  form_validator: ^2.1.1
  #flutterwave_standard: ^1.0.8
  easy_localization: ^3.0.5
  screenshot: ^3.0.0
  path_provider: ^2.1.2
  image_gallery_saver: ^2.0.3
  in_app_update: ^4.2.3
  #uuid: ^4.3.3


dev_dependencies:
  build_runner: any
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/audio/
    - assets/.env
    - assets/translations/
    - shorebird.yaml

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/interregular.ttf
        - asset: assets/fonts/interlight.ttf
          style: italic
